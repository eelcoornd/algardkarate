<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook-tilkobling – Ålgård Karateklubb</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  code { display: block; word-break: break-all; background: #f3f3f3; padding: .75rem; border-radius: 6px; margin: 1rem 0; }
</style>
</head>
<body>
<h1>Facebook-tilkobling</h1>
<p>Denne siden brukes kun under oppsett av klubbens Facebook-tilkobling. Kopier koden under og send den til klubbens administrator.</p>
<code id="code">Ingen kode funnet i adressen.</code>
<script>
  (function () {
    var p = new URLSearchParams(window.location.search);
    var code = p.get('code');
    var err = p.get('error_description') || p.get('error');
    var el = document.getElementById('code');
    if (code) { el.textContent = code; }
    else if (err) { el.textContent = 'Feil fra Facebook: ' + err; }
  })();
</script>
</body>
</html>
